defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/rdt@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_rdt_eval"
    logger_backends: ["wandb"] # wandb, swanlab, tensorboard
  
  max_epochs: 1000
  max_steps: -1
  
  # ========== EVAL MODE ==========
  only_eval: True
  eval_policy_path: null  # Optional: .pt file or None, if None, will use the checkpoint in rollout.model.model_path
  # ==============================
  
  val_check_interval: -1
  save_interval: 100

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 8
  eval_rollout_epoch: 2  # Number of eval rollout epochs (must be > 0 for eval)

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean" 
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  
  # params for generation
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6  # Lower temperature for more deterministic eval
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  # ========== EVAL ENVIRONMENT ==========
  eval:
    total_num_envs: 8  # TEST: Reduce to 10 (close to original RDT's 5) to test parallel effect
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 720  # Match original RDT (was 240)
    max_steps_per_rollout_epoch: 720  # Match original RDT (was 240)
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    max_trials_per_task: 1  # KEY FIX: Only use the first init state (trial 0) of each task, like original RDT
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: True  # Save evaluation videos
      video_base_dir: ${runner.logger.log_path}/video/eval
    # ⚠️ 关键：必须与 RDT 训练时的分辨率一致（128×128）
    init_params:
      camera_heights: 128
      camera_widths: 128
  # ======================================

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  # ========== MODEL PATH ==========
  model:
    model_path: "/path/to/your/rdt/checkpoint"  # CHANGE THIS to your RDT checkpoint path
    precision: ${actor.model.precision}
  # =================================

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 1024
  seed: 20241201  # Aligned with original RDT eval
  enable_offload: False

  # Override the default values in model/rdt
  model:
    model_path: "/path/to/your/rdt/checkpoint"  # CHANGE THIS to your RDT checkpoint path
    model_type: "rdt"
    add_value_head: True
    num_action_chunks: 8  # Consistent with original RDT exec_horizon: 8
    denoising_steps: 10  # Fast inference with 5 denoising steps
    precision: "bf16"

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  
  fsdp_config:
    strategy: "fsdp"
    use_orig_params: True  # Allow freezing encoder parameters
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

